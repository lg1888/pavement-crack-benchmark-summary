<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prediction Examples</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f7f9; color:#17212b; font-family:Arial,sans-serif; }
    main { width:calc(100% - 64px); max-width:1600px; margin:0 auto; padding:18px 20px 28px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; }
    h1 { margin:0; color:#173f63; font-size:28px; }
    a { color:#075f96; font-weight:700; text-decoration:none; white-space:nowrap; }
    a:hover { text-decoration:underline; }
    .columns { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:center; background:#fff; border:1px solid #cbd8e2; border-bottom:0; border-radius:8px 8px 0 0; padding:13px 0 11px; }
    .columns > a, .columns > span { text-align:center; color:#173f63; font-size:22px; font-weight:700; }
    .columns > a { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .column-title { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:4px; }
    .citation { color:#536575; font-size:14px; font-weight:600; text-decoration:none; }
    img { display:block; width:100%; height:auto; background:#fff; border:1px solid #cbd8e2; border-top:0; border-radius:0 0 8px 8px; }
    @media (max-width:700px) { main{width:calc(100% - 16px);padding:12px 8px} h1{font-size:20px} .top{align-items:flex-start} .columns>a,.columns>span{font-size:15px} .citation{font-size:11px} }
  </style>
</head>
<body>
<main>
  <div class="top"><h1 id="title">Prediction Examples</h1><a href="pavement_crack_dataset_benchmark.html">Back to summary</a></div>
  <div class="columns">
    <a id="originalLink" target="_blank" rel="noopener"><span class="column-title">Original &#8599;</span><span class="citation" id="originalCitation"></span></a>
    <a id="benchmarkLink" target="_blank" rel="noopener"><span class="column-title">Benchmark &#8599;</span><span class="citation" id="benchmarkCitation"></span></a>
    <span id="predictionLabel">Prediction</span>
  </div>
  <img id="figure" alt="Original images, benchmark labels, and predictions">
</main>
<script>
const datasets = {
  crack500: {name:'Crack500', image:'assets/crack500_examples_10.jpg', original:'https://github.com/fyangneil/pavement-crack-detection', originalCitation:'Zhang et al. (2016)', benchmark:'https://github.com/fyangneil/pavement-crack-detection', benchmarkCitation:'Zhang et al. (2016)', version:'V60'},
  pavebench: {name:'PaveBench', image:'assets/pavebench_examples_10.jpg', original:'https://huggingface.co/datasets/MML-Group/PaveBench', originalCitation:'Li et al. (2026)', benchmark:'https://huggingface.co/datasets/MML-Group/PaveBench', benchmarkCitation:'Li et al. (2026)', version:'V60'},
  cfd: {name:'CFD', image:'assets/cfd_examples_10.jpg', original:'https://github.com/cuilimeng/CrackForest-dataset', originalCitation:'Shi et al. (2016)', benchmark:'https://github.com/cuilimeng/CrackForest-dataset', benchmarkCitation:'Shi et al. (2016)', version:'V60'},
  gaps384: {name:'GAPs384', image:'assets/gaps384_examples_10.jpg', original:'https://www.tu-ilmenau.de/universitaet/fakultaeten/fakultaet-informatik-und-automatisierung/profil/institute-und-fachgebiete/institut-fuer-technische-informatik-und-ingenieurinformatik/fachgebiet-neuroinformatik-und-kognitive-robotik/data-sets-code/german-asphalt-pavement-distress-dataset-gaps', originalCitation:'Eisenbach et al. (2017)', benchmark:'https://github.com/fyangneil/pavement-crack-detection', benchmarkCitation:'Yang et al. (2019)', version:'V60'},
  crackls315: {name:'CrackLS315', image:'assets/crackls315_examples_10.jpg', original:'https://github.com/qinnzou/DeepCrack', originalCitation:'Zou et al. (2019)', benchmark:'https://github.com/qinnzou/DeepCrack', benchmarkCitation:'Zou et al. (2019)', version:'V60'},
  crkwh100: {name:'CRKWH100', image:'assets/crkwh100_examples_10.jpg', original:'https://1drv.ms/f/s!AittnGm6vRKLtylBkxVXw5arGn6R', originalCitation:'Zou et al. (2019)', benchmark:'https://1drv.ms/f/s!AittnGm6vRKLglyfiCw_C6BDeFsP', benchmarkCitation:'Zou et al. (2019)', version:'V60'},
  crackseg354: {name:'CrackSeg', image:'assets/crackseg354_examples_10.jpg', original:'https://github.com/TRMetaGroup/CrackSeg', originalCitation:'Zhou et al. (2024)', benchmark:'https://github.com/TRMetaGroup/CrackSeg', benchmarkCitation:'Zhou et al. (2024)', version:'V73'},
  pavecrack1300: {name:'PaveCrack1300', image:'assets/pavecrack1300_examples_10.jpg', original:'https://data.mendeley.com/datasets/8b27pdcxv7/1', originalCitation:'Liang et al. (2026)', benchmark:'https://data.mendeley.com/datasets/8b27pdcxv7/1', benchmarkCitation:'Liang et al. (2026)', version:'V60'},
  sut_crack: {name:'SUT-Crack', image:'assets/sut_crack_examples_10.jpg', original:'https://data.mendeley.com/datasets/gsbmknrhkv/6', originalCitation:'Sabouri & Sepidbar (2023)', benchmark:'https://data.mendeley.com/datasets/gsbmknrhkv/6', benchmarkCitation:'Sabouri & Sepidbar (2023)', version:'V60'},
  nha12d: {name:'NHA12D', image:'assets/nha12d_examples_10.jpg', original:'https://github.com/ZheningHuang/NHA12D-Crack-Detection-Dataset-and-Comparison-Study', originalCitation:'Huang et al. (2022)', benchmark:'https://github.com/ZheningHuang/NHA12D-Crack-Detection-Dataset-and-Comparison-Study', benchmarkCitation:'Huang et al. (2022)', version:'V60'},
  deepcrack237: {name:'DeepCrack237', image:'assets/deepcrack237_examples_10.jpg', original:'https://github.com/yhlleo/DeepCrack', originalCitation:'Liu et al. (2019)', benchmark:'https://github.com/yhlleo/DeepCrack', benchmarkCitation:'Liu et al. (2019)', version:'V60'}
};
const key = new URLSearchParams(location.search).get('dataset');
const item = datasets[key] || datasets.pavebench;
document.title = item.name + ' Prediction Examples';
document.getElementById('title').textContent = item.name + ' — Prediction Examples';
document.getElementById('figure').src = item.image;
document.getElementById('predictionLabel').textContent = 'Prediction (' + item.version + ')';
document.getElementById('originalCitation').textContent = item.originalCitation;
document.getElementById('benchmarkCitation').textContent = item.benchmarkCitation;
for (const [id, url, label] of [
  ['originalLink', item.original, item.name + ' original-image source'],
  ['benchmarkLink', item.benchmark, item.name + ' benchmark-label source']
]) {
  const link = document.getElementById(id);
  link.href = url;
  link.title = label;
  link.setAttribute('aria-label', label + ' (opens in a new tab)');
}
</script>
</body>
</html>
